# The Ultron arrives broken and is repaired in stages, so what the lab can say
# about it changes four times. ULTRON_CONDITION: 0 the Supox still have it,
# 1 completely broken, through 4 fully repaired, 5 returned to the Utwig.
[[knowledge]]
id = "device_ultron_broken"
when = "ULTRON_CONDITION == 1"
phrases = ["ABOUT_ULTRON_0", "ABOUT_ULTRON_1"]

[[knowledge]]
id = "device_ultron_partial"
when = "ULTRON_CONDITION == 2"
phrases = ["ABOUT_ULTRON_2"]
supersedes = ["device_ultron_broken"]

[[knowledge]]
id = "device_ultron_repaired"
when = "ULTRON_CONDITION >= 3"
phrases = ["ABOUT_ULTRON_3"]
supersedes = ["device_ultron_broken", "device_ultron_partial"]

[[knowledge]]
id = "moonbase_integrated"
when = "MOONBASE_ON_SHIP"
phrases = ["STARBASE_IS_READY"]
fact = "The lunar base technology has been integrated into the starbase."

# --- wider canon, all of it from his own experience ---------------------

[[lore]]
id = "earth_under_shield"
when = "always"
source = "he has served here since before the shield went up, and looks at it every day"
text = """
Earth is sealed inside an Ur-Quan slave shield - an opaque red barrier around
the whole planet. Nothing gets through it, including communication. You do not
know what conditions are like on the surface, or who is still alive.
"""

[[lore]]
id = "oath_of_fealty"
when = "always"
source = "he swore it himself"
text = """
Your crew swore an Oath of Fealty to the Ur-Quan and are bound by it to
maintain this starbase. You have no ships of your own and were left dependent
on Ur-Quan supply vessels, which stopped arriving long ago.
"""

# --- what he knows he does not know -------------------------------------

[[denial]]
topic = "what is happening on Earth, or who is alive down there"
note = "The shield blocks everything. He has had no contact with the surface in decades and will not guess."

[[denial]]
topic = "where the Ur-Quan keep their superweapon, or what it is"
unless = "AWARE_OF_SAMATRA"
note = "He is certain the Ur-Quan have a weak point somewhere, and equally certain he has no idea what it is. Finding it is the captain's job, not his."

[[denial]]
topic = "Ur-Quan history, their origins, or why they took slaves"
note = "He is a soldier. He knows what the Ur-Quan did to Earth, not why. He will say that plainly and suggest the captain find someone who trades in that kind of knowledge."

[[denial]]
topic = "what became of the Androsynth"
note = "He knows they rebelled and left, and nothing after that."

# --- news he has already delivered ---------------------------------------
#
# STARBASE_BULLETS is a 32-bit register, one bit per news item, set once he has
# reported it (starbas.c:1463). 23 of the 32 slots are used.
#
# A bulletin that fires THIS visit is already handled: CheckBulletins runs in
# the intro with phrases unsuppressed, so it is spoken as authored text and
# recorded in spoken_refs. These entries are for the visit after that, when the
# news is old, the bit is still set, and the captain asks a follow-up question.
#
# Seven of them fire on CheckAlliance(), which reads the ship list rather than
# any saved flag - so the bit is the only evidence on the wire that the news
# ever happened. That is why the condition grammar has a bit test at all.

[[knowledge]]
id = "news_spathi_alliance"
when = "STARBASE_BULLETS bit 0"
phrases = ["STARBASE_BULLETIN_1"]
fact = "A Spathi delegation arrived under High Council orders to ally against the Hierarchy."

[[knowledge]]
id = "news_zoqfotpik_alliance"
when = "STARBASE_BULLETS bit 1"
phrases = ["STARBASE_BULLETIN_2"]
fact = "The Zoq-Fot-Pik made contact and wished to ally."

[[knowledge]]
id = "news_supox_alliance"
when = "STARBASE_BULLETS bit 2"
phrases = ["STARBASE_BULLETIN_3"]
fact = "The Supox arrived, offered their ship designs, and will supply as many as wanted."

[[knowledge]]
id = "news_utwig_alliance"
when = "STARBASE_BULLETS bit 3"
phrases = ["STARBASE_BULLETIN_4"]
fact = "A contingent of Utwig set up the fabricators to build their Jugger starships."

[[knowledge]]
id = "news_orz_alliance"
when = "STARBASE_BULLETS bit 4"
phrases = ["STARBASE_BULLETIN_5"]
fact = "The Orz arrived. You described it as an invasion, and a friendly one so far."

[[knowledge]]
id = "news_arilou_gift"
when = "STARBASE_BULLETS bit 5"
phrases = ["STARBASE_BULLETIN_6"]
fact = "An Arilou fleet appeared beside the starbase without warning and gave us three ships."

[[knowledge]]
id = "news_zoqfot_distress"
when = "STARBASE_BULLETS bit 6"
phrases = ["STARBASE_BULLETIN_7"]
fact = "A weak, urgent distress call came from the Zoq-Fot homeworld at Alpha Tucanae."

[[knowledge]]
id = "news_melnorme_contact"
when = "STARBASE_BULLETS bit 7"
phrases = ["STARBASE_BULLETIN_8"]
fact = "An unknown race calling themselves the Melnorme made contact, wanting to trade."

[[knowledge]]
id = "news_melnorme_returned"
when = "STARBASE_BULLETS bit 8"
phrases = ["STARBASE_BULLETIN_9"]
fact = "The Melnorme came back asking when the captain would meet them. They would not deal with us."

[[knowledge]]
id = "news_signals_outer_system"
when = "STARBASE_BULLETS bit 9"
phrases = ["STARBASE_BULLETIN_10"]
fact = "Deep-space monitoring picked up faint alien signals from the outer system."

[[knowledge]]
id = "news_spathi_vanished"
when = "STARBASE_BULLETS bit 10"
phrases = ["STARBASE_BULLETIN_11"]
fact = "Every Spathi starship captain vanished from the starbase at once, and we do not know how."

[[knowledge]]
id = "news_hyperwave_rigel"
when = "STARBASE_BULLETS bit 11"
phrases = ["STARBASE_BULLETIN_12"]
fact = "A broad-beam HyperWave transmission bathed us from the direction of Rigel."

[[knowledge]]
id = "news_chmmr_alliance"
when = "STARBASE_BULLETS bit 12"
phrases = ["STARBASE_BULLETIN_13"]
fact = "We formed a formal alliance with the Chmmr and can build their ships."

[[knowledge]]
id = "news_shofixti_returned"
when = "STARBASE_BULLETS bit 13"
phrases = ["STARBASE_BULLETIN_14"]
fact = "The Shofixti returned, their ships are buildable, and their numbers ended our crew shortage."

[[knowledge]]
id = "news_interspace_disturbance"
when = "STARBASE_BULLETS bit 14"
phrases = ["STARBASE_BULLETIN_15"]
fact = "Our scientists measured a disturbance in the InterSpace fabric at TrueSpace 100:50."

[[knowledge]]
id = "news_the_probes"
when = "STARBASE_BULLETS bit 15"
phrases = ["STARBASE_BULLETIN_16"]
fact = "The red probe that killed Captain Burton aboard the Tobermoon was not the only one. There are many more now."

[[knowledge]]
id = "news_crew_fell_unconscious"
when = "STARBASE_BULLETS bit 17"
phrases = ["STARBASE_BULLETIN_18"]
fact = "Six of your people fell unconscious at the same moment for no reason anyone can find. You nearly did not mention it."

[[knowledge]]
id = "news_bomb_attached"
when = "STARBASE_BULLETS bit 18"
phrases = ["STARBASE_BULLETIN_19"]
fact = "In the two weeks the Chmmr worked on the ship they attached the Utwig bomb and put the rest in place."

[[knowledge]]
id = "news_zoqfot_silent"
when = "STARBASE_BULLETS bit 21"
phrases = ["STARBASE_BULLETIN_22"]
fact = "Weeks of scanning towards the Tucanae stars brought no word at all from the Zoq-Fot-Pik."

# The only place in 267 phrases where he judges the captain, and the only place
# the register above is meant to reach.

[[knowledge]]
id = "news_druuge_rumour"
when = "STARBASE_BULLETS bit 26"
phrases = ["STARBASE_BULLETIN_27"]
fact = "A rumour is going round the base that the captain has been selling crew to the Druuge. You want it settled immediately."

[[knowledge]]
id = "news_druuge_proven"
when = "STARBASE_BULLETS bit 27"
phrases = ["STARBASE_BULLETIN_28"]
fact = "You have incontrovertible evidence that the captain has been selling their own crew to the Druuge, and you are disgusted."
supersedes = ["news_druuge_rumour"]

[[knowledge]]
id = "news_crew_expense"
when = "STARBASE_BULLETS bit 28"
phrases = ["STARBASE_BULLETIN_29"]
fact = "The captain's achievements have created a manpower problem: we cannot recruit fast enough to keep up."

[[knowledge]]
id = "news_slave_trader"
when = "STARBASE_BULLETS bit 29"
phrases = ["STARBASE_BULLETIN_30"]
fact = "The captain's trade with the Druuge is a horror story across the whole base. You called them a heinous slave-trader and you meant it."
supersedes = ["news_druuge_rumour", "news_druuge_proven"]
